{% extends 'base.html' %}

{% block content %}
<style>
    .auth-wrapper { max-width: 450px; margin: 60px auto 80px; font-family: 'Jost', sans-serif; padding: 0 20px; }
    .auth-card { background: #fff; border: 1px solid #f0f0f0; padding: 40px; box-shadow: 0 8px 30px rgba(0,0,0,0.04); }
    .auth-title { font-family: 'Playfair Display', serif; font-size: 28px; color: #1a1a1a; margin: 0 0 30px 0; text-align: center; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .auth-input { width: 100%; padding: 14px 15px; font-family: 'Jost', sans-serif; font-size: 14px; border: 1px solid #e5e5e5; background: #fafafa; transition: border 0.3s; box-sizing: border-box; }
    .auth-input:focus { border-color: #976f44; outline: none; background: #fff; }
    
    .auth-btn { display: block; width: 100%; background-color: #976f44; color: #fff; padding: 16px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; border: none; cursor: pointer; transition: 0.3s ease; margin-top: 30px; text-align: center; text-decoration: none; }
    .auth-btn:hover { background-color: #1a1a1a; }
    
    .auth-error { color: #d9534f; font-size: 12px; margin-top: 6px; font-weight: 500; }
    .auth-footer { text-align: center; margin-top: 25px; font-size: 14px; color: #666; border-top: 1px solid #f0f0f0; padding-top: 20px; }
    .auth-footer a { color: #976f44; text-decoration: none; font-weight: 600; transition: color 0.3s; }
    .auth-footer a:hover { color: #1a1a1a; }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <h4 class="auth-title">Secure Login</h4>
        
        <form method="POST">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="auth-error">{{ field.errors.0 }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            
            <button type="submit" class="auth-btn">Sign In</button>
        </form>
        
        <div class="auth-footer">
            Don't have an account? <a href="{% url 'register' %}">Register here</a>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('input:not([type="hidden"]):not([type="search"]):not([type="submit"])').forEach(e => {
        e.removeAttribute('class');
        e.classList.add('auth-input');
    });
</script>
{% endblock %}
