{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-danger rounded-3 border-2">
            <div class="card-header bg-danger text-white text-center py-3">
                <h4 class="mb-0 fw-bold">Admin Secure Login</h4>
            </div>
            <div class="card-body p-4 bg-dark text-white">
                <form method="POST">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold text-light">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-warning small mt-1">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    
                    <button type="submit" class="btn btn-danger w-100 py-2 mt-3 fw-bold">Authenticate</button>
                </form>
            </div>
            <div class="card-footer text-center bg-dark text-secondary py-3 border-top border-secondary">
                <small>Restricted Area. <a href="{% url 'login' %}" class="text-decoration-none text-info">Normal user login</a></small>
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('input').forEach(e => e.classList.add('form-control'));
</script>
{% endblock %}
