{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-lg border-danger rounded-3 border-2">
            <div class="card-header bg-danger text-white text-center py-3">
                <h4 class="mb-0 fw-bold">Authorize New Administrator</h4>
            </div>
            <div class="card-body p-4 bg-dark text-white">
                <form method="POST">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold text-light">
                                {{ field.label }} 
                                {% if field.name == 'passcode' %}
                                    <span class="badge bg-warning text-dark ms-2">Required</span>
                                {% endif %}
                            </label>
                            
                            {{ field }}
                            
                            {% if field.errors %}
                                <div class="text-warning small mt-1">{{ field.errors }}</div>
                            {% endif %}
                            {% if field.help_text %}
                                <div class="text-secondary small mt-1">{{ field.help_text }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    
                    <button type="submit" class="btn btn-danger w-100 py-2 mt-4 fw-bold">Create Admin Profile</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('input').forEach(e => {
        e.classList.add('form-control');
        e.classList.add('bg-secondary');
        e.classList.add('text-white');
        e.classList.add('border-secondary');
    });
</script>
{% endblock %}
